---
# zizmor (GitHub Actions security linter) configuration for super-linter.
rules:
  dangerous-triggers:
    ignore:
      # greetings.yml needs pull_request_target so the first-interaction action can comment on
      # pull requests from forks. It never checks out or runs the pull request's code, so the
      # usual risk of this trigger (executing untrusted code with a privileged token) is absent.
      - greetings.yml
