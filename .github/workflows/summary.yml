---
name: Summarize new issues

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
        with:
          prompt: |
            Summarize the following GitHub issue in one paragraph:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

      # The model output is derived from an attacker-controllable issue body, so it must reach
      # the shell only through an environment variable. Expanding it with ${{ }} inside the
      # script lets a crafted issue break out of the quotes and run commands with this token.
      - name: Comment with AI summary
        run: gh issue comment "$ISSUE_NUMBER" --body "$RESPONSE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh needs the repository named explicitly.
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESPONSE: ${{ steps.inference.outputs.response }}
