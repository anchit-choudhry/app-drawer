---
name: Greetings

on: [pull_request_target, issues]

permissions:
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@3c71ce730280171fd1cfb57c00c774f8998586f7 # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            Thanks for opening your first issue. Please include your Node.js version, the steps
            to reproduce, and any relevant server logs. Never paste secrets.
          pr-message: >-
            Thanks for your first pull request. Please confirm that `npm test` passes and
            describe what the change does and why.
