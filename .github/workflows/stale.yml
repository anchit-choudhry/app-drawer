---
# This workflow warns and then closes issues and PRs that have had no activity for a specified
# amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "16 0 * * *"

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@f7176fd3007623b69d27091f9b9d4ab7995f0a06 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: >-
            This issue has had no activity for 60 days and will be closed in 7 days unless
            there is new activity.
          stale-pr-message: >-
            This pull request has had no activity for 60 days and will be closed in 7 days
            unless there is new activity.
          stale-issue-label: "no-issue-activity"
          stale-pr-label: "no-pr-activity"
