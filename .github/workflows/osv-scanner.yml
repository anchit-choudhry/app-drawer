---
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Periodic OSV-Scanner scan for vulnerabilities, plus a pull request check that fails if new
# vulnerabilities are introduced. Options, including how to ignore a specific vulnerability:
# https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  schedule:
    - cron: "24 2 * * 4"
  push:
    branches: ["main"]

permissions:
  # Read commit contents. The wider grants (security-events: write to upload SARIF, and
  # actions: read, see https://github.com/github/codeql-action/issues/2117) are declared on
  # each job below, per the repo's workflow permissions policy.
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        --include-git-root
        ./
      upload-sarif: true
      fail-on-vuln: true
    permissions:
      # Read commit contents
      contents: read
      # Require writing security events to upload SARIF file to security tab
      security-events: write
      # Required to upload SARIF file to CodeQL.
      # See: https://github.com/github/codeql-action/issues/2117
      actions: read
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: |-
        -r
        --include-git-root
        ./
      upload-sarif: true
      fail-on-vuln: true
    permissions:
      # Read commit contents
      contents: read
      # Require writing security events to upload SARIF file to security tab
      security-events: write
      # Required to upload SARIF file to CodeQL.
      # See: https://github.com/github/codeql-action/issues/2117
      actions: read
