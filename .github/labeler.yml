---
# Labels applied to pull requests by .github/workflows/label.yml (actions/labeler v5 and later
# format: each label maps to a list of changed-files matchers). A label is applied when any
# changed file matches any of its globs.

express-static-serve:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/express-static-serve/server.js"
          - "packages/express-static-serve/ecosystem.config.js"
          - "packages/express-static-serve/views/**"

scripts:
  - changed-files:
      - any-glob-to-any-file: "packages/*/scripts/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "packages/*/test/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "packages/*/package.json"
          - ".npmrc"
          - ".nvmrc"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "!.claude/**"
          - "!.gemini/**"

ai-tooling:
  - changed-files:
      - any-glob-to-any-file:
          - ".claude/**"
          - ".gemini/**"
          - "CLAUDE.md"
          - "GEMINI.md"
